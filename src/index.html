<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بزن بره — ساده‌ترین اپ Todo</title>
  <meta name="description" content="بزن بره یه اپ ساده فارسی برای مدیریت کارهای روزانه‌ست. حداکثر ۵ تسک، بدون حساب کاربری، کاملاً آفلاین.">
  <link rel="canonical" href="https://bezanbere.ir">

  <!-- Open Graph -->
  <meta property="og:title" content="بزن بره — ساده‌ترین اپ مدیریت کار">
  <meta property="og:description" content="بزن بره یه اپ ساده فارسی برای مدیریت کارهای روزانه‌ست. حداکثر ۵ تسک، بدون حساب کاربری، کاملاً آفلاین.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bezanbere.ir">
  <meta property="og:image" content="https://bezanbere.ir/icons/icon-512.png">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="بزن بره">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="بزن بره — ساده‌ترین اپ Todo">
  <meta name="twitter:description" content="بزن بره یه اپ ساده فارسی برای مدیریت کارهای روزانه‌ست. حداکثر ۵ تسک، بدون حساب کاربری، کاملاً آفلاین.">
  <meta name="twitter:image" content="https://bezanbere.ir/icons/icon-512.png">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "بزن بره",
    "url": "https://bezanbere.ir",
    "description": "اپ ساده فارسی برای مدیریت کارهای روزانه. حداکثر ۵ تسک، بدون حساب کاربری، کاملاً آفلاین.",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web, Android, iOS",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IRR" },
    "inLanguage": "fa"
  }
  </script>
  <meta name="theme-color" content="#deb887">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-arabic-400-normal.woff2" crossorigin>
  <link rel="stylesheet" href="./style.css">
</head>
<body
  x-data
  x-init="$store.app.init()"
  class="app-body">

  <!-- App frame: phone-width on desktop, full-width on mobile -->
  <div class="app-frame">

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title" x-text="$store.app.t.appTitle"></h1>
    <button
      @click="$store.app.openSettings()"
      class="theme-btn"
      :aria-label="$store.app.t.settingsBtn">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.527-.94 3.31.842 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.527-.842 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.527.94-3.31-.842-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.527.842-3.31 2.37-2.37.996.613 2.296.07 2.572-1.065z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
    </button>
  </header>

  <!-- Task List -->
  <main class="app-main">

    <!-- Empty state -->
    <div
      x-show="$store.app.tasks.length === 0"
      class="empty-state">
      <p class="empty-title" x-text="$store.app.t.emptyTitle"></p>
      <p class="empty-subtitle" x-text="$store.app.emptySubtitle()"></p>
    </div>

    <!-- Tasks -->
    <ul class="task-list">
      <template x-for="task in $store.app.tasks" :key="task.id">
        <li
          x-data="{ startX: 0, dragX: 0 }"
          x-transition:enter="transition ease-out duration-150"
          x-transition:enter-start="opacity-0 -translate-y-1"
          x-transition:enter-end="opacity-100 translate-y-0"
          @touchstart.passive="startX = $event.touches[0].clientX"
          @touchmove.passive="dragX = Math.max(0, $event.touches[0].clientX - startX)"
          @touchend="if (dragX > 80) $store.app.deleteTask(task.id); dragX = 0"
          :style="dragX > 0 ? `transform: translateX(${dragX}px); opacity: ${1 - dragX / 160}` : ''"
          :class="$store.app.completing.includes(task.id) ? 'opacity-0' : 'opacity-100'"
          class="task-card">

          <!-- Complete button -->
          <button
            @click="$store.app.completeTask(task.id)"
            class="task-check"
            :aria-label="$store.app.t.completeTask">
          </button>

          <!-- Title -->
          <span
            :class="$store.app.completing.includes(task.id) ? 'line-through text-sand-400 dark:text-sand-600' : 'text-sand-900 dark:text-sand-100'"
            class="task-title"
            x-text="task.title">
          </span>

          <!-- Delete button -->
          <button
            @click="$store.app.deleteTask(task.id)"
            class="task-delete"
            :aria-label="$store.app.t.deleteTask">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
              <path stroke-linecap="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </li>
      </template>
    </ul>

    <div
      x-show="$store.app.tasks.length > 0 && $store.app.tasks.length < $store.app.taskLimit"
      x-transition
      class="remaining-msg">
      <span x-text="$store.app.remainingMessage()"></span>
    </div>

    <!-- Blocked message -->
    <div
      x-show="$store.app.tasks.length >= $store.app.taskLimit"
      x-transition
      class="blocked-msg">
      <span x-text="$store.app.t.blockedMessage"></span>
    </div>

  </main>

  <!-- Floating Add Button (absolute within app frame) -->
  <button
    x-show="$store.app.tasks.length < $store.app.taskLimit"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 scale-90"
    x-transition:enter-end="opacity-100 scale-100"
    @click="$store.app.openModal()"
    class="fab"
    :aria-label="$store.app.t.addTask">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" d="M12 4v16m-8-8h16"/>
    </svg>
  </button>

  <!-- About button (mirrors FAB on the left) -->
  <button @click="$store.app.about = true" class="about-btn">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/>
    </svg>
    <span x-text="$store.app.t.aboutLink"></span>
  </button>

  </div><!-- /app frame -->

  <!-- Settings Modal -->
  <div
    x-show="$store.app.settings"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeSettings()"
    @keydown.escape.window="$store.app.closeSettings()"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card settings-modal">
      <h2 class="about-modal-title" x-text="$store.app.t.settingsTitle"></h2>

      <div class="settings-group">
        <p class="settings-label" x-text="$store.app.t.themeSetting"></p>
        <div class="settings-options">
          <button
            @click="$store.app.setThemeMode('light')"
            :class="$store.app.themeMode === 'light' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeLight">
          </button>
          <button
            @click="$store.app.setThemeMode('dark')"
            :class="$store.app.themeMode === 'dark' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeDark">
          </button>
          <button
            @click="$store.app.setThemeMode('system')"
            :class="$store.app.themeMode === 'system' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeSystem">
          </button>
        </div>
      </div>

      <div class="settings-group">
        <p class="settings-label" x-text="$store.app.taskLimitTitle()"></p>
        <input
          type="number"
          dir="ltr"
          inputmode="numeric"
          class="settings-number-input"
          :min="$store.app.taskLimitMin()"
          max="20"
          x-model="$store.app.taskLimitDraft"
          @blur="$store.app.applyTaskLimit($event.target)"
          @keydown.enter.prevent="$store.app.applyTaskLimit($event.target)">
        <p
          x-show="$store.app.tasks.length > 0"
          class="settings-help"
          x-text="$store.app.t.taskLimitHint.replace('{count}', $store.app.toFaNumber($store.app.tasks.length))">
        </p>
      </div>
    </div>
  </div>

  <!-- About Modal -->
  <div
    x-show="$store.app.about"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.about = false"
    @keydown.escape.window="$store.app.about = false"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card about-modal">
      <h2 class="about-modal-title" x-text="$store.app.t.aboutTitle"></h2>
      <p class="about-modal-body" x-text="$store.app.t.aboutBody"></p>
      <p class="about-modal-body opacity-60 text-sm mt-2" x-text="$store.app.t.offlineNote"></p>
      <button
        x-show="$store.app.installPrompt"
        @click="$store.app.installApp()"
        class="mt-4 w-full py-2 px-4 rounded-xl bg-sand-600 text-white text-sm font-medium hover:bg-sand-700 active:scale-95 transition">
        <span x-text="$store.app.t.installBtn"></span>
      </button>
      <p class="mt-5 text-xs opacity-40 text-center">
        ساخته شده با ❤️ توسط
        <a href="https://github.com/ohmydevops/bezanbere.ir" target="_blank" rel="noopener noreferrer" class="underline underline-offset-2 hover:opacity-80">ohmydevops</a>
      </p>
    </div>
  </div>

  <!-- Add Modal -->
  <div
    x-show="$store.app.modal"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeModal()"
    @keydown.escape.window="$store.app.closeModal()"
    class="modal-overlay">

    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card">
      <div class="flex items-center gap-2">
        <input
          id="task-input"
          x-model="$store.app.newTitle"
          @keydown.enter="$store.app.addTask()"
          @keydown.escape="$store.app.closeModal()"
          type="text"
          :placeholder="$store.app.t.addPlaceholder"
          maxlength="100"
          autocomplete="off"
          class="modal-input flex-1">
        <button
          @click="$store.app.addTask()"
          :disabled="!$store.app.newTitle.trim()"
          class="lg:hidden shrink-0 w-11 h-11 flex items-center justify-center rounded-xl bg-sand-600 text-white disabled:opacity-30 active:scale-95 transition"
          :aria-label="$store.app.t.addTask">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>

</body>
</html>
