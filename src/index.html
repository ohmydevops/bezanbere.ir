<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>بزن بره — ساده‌ترین اپ Todo</title>
  <meta name="description" content="بزن بره؛ ساده‌ترین اپ فارسی برای مدیریت کارهای روزانه">
  <link rel="canonical" href="https://bezanbere.ir">

  <!-- Open Graph -->
  <meta property="og:title" content="بزن بره">
  <meta property="og:description" content="بزن بره؛ ساده‌ترین اپ فارسی برای مدیریت کارهای روزانه">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bezanbere.ir">
  <meta property="og:image" content="https://bezanbere.ir/icons/icon-512.png">
  <meta property="og:locale" content="fa_IR">
  <meta property="og:site_name" content="بزن بره">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="بزن بره">
  <meta name="twitter:description" content="بزن بره؛ ساده‌ترین اپ فارسی برای مدیریت کارهای روزانه">
  <meta name="twitter:image" content="https://bezanbere.ir/icons/icon-512.png">

  <!-- JSON-LD -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "بزن بره",
    "url": "https://bezanbere.ir",
    "description": "بزن بره؛ ساده‌ترین اپ فارسی برای مدیریت کارهای روزانه",
    "applicationCategory": "ProductivityApplication",
    "operatingSystem": "Web, Android, iOS",
    "offers": { "@type": "Offer", "price": "0", "priceCurrency": "IRR" },
    "inLanguage": "fa"
  }
  </script>
  <meta name="theme-color" content="#deb887">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/vazirmatn-arabic-400-normal.woff2" crossorigin>
  <style>
    [x-cloak] { display: none !important; }
  </style>
  <link rel="stylesheet" href="./style.css">
</head>
<body
  x-data
  x-init="$store.app.init()"
  class="app-body">

  <!-- App frame: phone-width on desktop, full-width on mobile -->
  <div x-cloak class="app-frame">

  <!-- Header -->
  <header class="app-header">
    <h1 class="app-title" x-text="$store.app.t.appTitle"></h1>
    <div class="flex items-center gap-1">
      <button
        @click="$store.app.openHistory()"
        class="theme-btn"
        :aria-label="$store.app.t.historyBtn">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
      <button
        @click="$store.app.openSettings()"
        class="theme-btn"
        :aria-label="$store.app.t.settingsBtn">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.527-.94 3.31.842 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.527-.842 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.527.94-3.31-.842-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.527.842-3.31 2.37-2.37.996.613 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Task List -->
  <main class="app-main">

    <!-- Empty state -->
    <div
      x-show="$store.app.tasks.length === 0"
      class="empty-state">
      <p class="empty-title" x-text="$store.app.t.emptyTitle"></p>
      <p class="empty-subtitle" x-text="$store.app.emptySubtitle()"></p>
    </div>

    <!-- Tasks -->
    <ul id="task-list" class="task-list">
      <template x-for="task in $store.app.tasks" :key="task.id">
        <li
          x-data="{ startX: 0, dragX: 0 }"
          x-transition:enter="transition ease-out duration-150"
          x-transition:enter-start="opacity-0 -translate-y-1"
          x-transition:enter-end="opacity-100 translate-y-0"
          @touchstart.passive="startX = $event.touches[0].clientX"
          @touchmove.passive="dragX = Math.max(0, $event.touches[0].clientX - startX)"
          @touchend="if (dragX > 80) $store.app.deleteTask(task.id); dragX = 0"
          :style="dragX > 0 ? `transform: translateX(${dragX}px); opacity: ${1 - dragX / 160}` : ''"
          :class="$store.app.completing.includes(task.id) ? 'opacity-0' : 'opacity-100'"
          class="task-card">

          <!-- Drag handle -->
          <button
            type="button"
            class="task-drag-handle"
            :aria-label="$store.app.t.dragTask"
            :title="$store.app.t.dragTask"
            @click.stop>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7h.01M8 12h.01M8 17h.01M16 7h.01M16 12h.01M16 17h.01"/>
            </svg>
          </button>

          <!-- Complete button -->
          <button
            @click="$store.app.completeTask(task.id)"
            class="task-check"
            :aria-label="$store.app.t.completeTask">
          </button>

          <!-- Title -->
          <span
            :class="$store.app.completing.includes(task.id) ? 'line-through text-sand-400 dark:text-sand-600' : 'text-sand-900 dark:text-sand-100'"
            class="task-title cursor-pointer"
            @click="if (!$store.app.completing.includes(task.id)) $store.app.openDetail(task)"
            x-text="task.title">
          </span>

          <!-- Delete button -->
          <button
            @click="$store.app.deleteTask(task.id)"
            class="task-delete"
            :aria-label="$store.app.t.deleteTask">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>

        </li>
      </template>
    </ul>

    <div
      x-show="$store.app.tasks.length > 0 && $store.app.tasks.length < $store.app.taskLimit"
      x-transition
      class="remaining-msg">
      <span x-text="$store.app.remainingMessage()"></span>
    </div>

    <!-- Blocked message -->
    <div
      x-show="$store.app.tasks.length >= $store.app.taskLimit"
      x-transition
      class="blocked-msg">
      <span x-text="$store.app.t.blockedMessage"></span>
    </div>

  </main>

  <!-- Footer blur backdrop -->
  <div class="footer-blur" aria-hidden="true"></div>

  <!-- Floating Add Button (absolute within app frame) -->
  <button
    x-show="$store.app.tasks.length < $store.app.taskLimit"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0 scale-90"
    x-transition:enter-end="opacity-100 scale-100"
    @click="$store.app.openModal()"
    class="fab"
    :aria-label="$store.app.t.addTask">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
      <path stroke-linecap="round" d="M12 4v16m-8-8h16"/>
    </svg>
  </button>

  <!-- About button (mirrors FAB on the left) -->
  <button @click="$store.app.about = true" class="about-btn">
    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/>
    </svg>
    <span x-text="$store.app.t.aboutLink"></span>
  </button>

  </div><!-- /app frame -->

  <!-- Settings Modal -->
  <div
    x-cloak
    x-show="$store.app.settings"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeSettings()"
    @keydown.escape.window="$store.app.closeSettings()"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card settings-modal">
      <h2 class="about-modal-title" x-text="$store.app.t.settingsTitle"></h2>

      <div class="settings-group">
        <p class="settings-label" x-text="$store.app.t.themeSetting"></p>
        <div class="settings-options">
          <button
            @click="$store.app.setThemeMode('light')"
            :class="$store.app.themeMode === 'light' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeLight">
          </button>
          <button
            @click="$store.app.setThemeMode('dark')"
            :class="$store.app.themeMode === 'dark' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeDark">
          </button>
          <button
            @click="$store.app.setThemeMode('system')"
            :class="$store.app.themeMode === 'system' ? 'settings-option-active' : ''"
            class="settings-option"
            type="button"
            x-text="$store.app.t.themeSystem">
          </button>
        </div>
      </div>

      <hr class="border-sand-200 dark:border-sand-800">

      <div class="settings-group">
        <div class="flex items-center gap-3">
          <p class="settings-label flex-1" x-text="$store.app.taskLimitTitle()"></p>
          <input
            type="number"
            dir="ltr"
            inputmode="numeric"
            class="settings-number-input w-20 shrink-0"
            :min="$store.app.taskLimitMin()"
            max="20"
            x-model="$store.app.taskLimitDraft"
            @blur="$store.app.applyTaskLimit($event.target)"
            @keydown.enter.prevent="$store.app.applyTaskLimit($event.target)">
        </div>
        <p
          x-show="$store.app.tasks.length > 0"
          class="settings-help"
          x-text="$store.app.t.taskLimitHint.replace('{count}', $store.app.toFaNumber($store.app.tasks.length))">
        </p>
      </div>
    </div>
  </div>

  <!-- About Modal -->
  <div
    x-cloak
    x-show="$store.app.about"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.about = false"
    @keydown.escape.window="$store.app.about = false"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card about-modal">
      <h2 class="about-modal-title" x-text="$store.app.t.aboutTitle"></h2>
      <p class="about-modal-body" x-text="$store.app.t.aboutBody"></p>
      <p class="about-modal-body opacity-60 text-sm mt-2" x-text="$store.app.t.offlineNote"></p>
      <button
        x-show="$store.app.installPrompt"
        @click="$store.app.installApp()"
        class="mt-4 w-full py-2 px-4 rounded-xl bg-sand-600 text-white text-sm font-medium hover:bg-sand-700 active:scale-95 transition">
        <span x-text="$store.app.t.installBtn"></span>
      </button>
      <p class="mt-5 text-xs opacity-40 text-center">
        ساخته شده با ❤️ توسط
        <a href="https://github.com/ohmydevops/bezanbere.ir" target="_blank" rel="noopener noreferrer" class="underline underline-offset-2 hover:opacity-80">ohmydevops</a>
      </p>
    </div>
  </div>

  <!-- History Modal -->
  <div
    x-cloak
    x-show="$store.app.historyModal"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeHistory()"
    @keydown.escape.window="$store.app.closeHistory()"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card history-modal">
      <h2 class="about-modal-title" x-text="$store.app.t.historyTitle"></h2>

      <!-- Empty state -->
      <div
        x-show="$store.app.history.length === 0"
        class="py-8 text-center text-sand-500 dark:text-sand-600 text-sm select-none"
        x-text="$store.app.t.historyEmpty">
      </div>

      <!-- History list -->
      <ul x-show="$store.app.history.length > 0" class="history-list">
        <template x-for="item in $store.app.historyPageItems()" :key="item.id + item.completedAt">
          <li class="history-item">
            <span class="history-item-title" x-text="item.title"></span>
            <span class="history-item-date" x-text="$store.app.t.historyCompletedAt + ' ' + $store.app.toShamsiDate(item.completedAt)"></span>
          </li>
        </template>
      </ul>

      <!-- Pagination -->
      <div x-show="$store.app.historyTotalPages() > 1" class="history-pagination">
        <button
          @click="$store.app.historyPrevPage()"
          :disabled="$store.app.historyPage <= 1"
          class="history-page-btn"
          x-text="$store.app.t.historyPrev">
        </button>
        <span
          class="history-page-label"
          x-text="$store.app.t.historyPageLabel.replace('{current}', $store.app.toFaNumber($store.app.historyPage)).replace('{total}', $store.app.toFaNumber($store.app.historyTotalPages()))">
        </span>
        <button
          @click="$store.app.historyNextPage()"
          :disabled="$store.app.historyPage >= $store.app.historyTotalPages()"
          class="history-page-btn"
          x-text="$store.app.t.historyNext">
        </button>
      </div>
    </div>
  </div>

  <!-- Add Modal -->  <div
    x-cloak
    x-show="$store.app.modal"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeModal()"
    @keydown.escape.window="$store.app.closeModal()"
    class="modal-overlay">

    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card">
      <div class="flex items-start gap-2">
        <textarea
          id="task-input"
          x-model="$store.app.newTitle"
          @keydown.enter.prevent="$store.app.addTask()"
          @keydown.escape="$store.app.closeModal()"
          :placeholder="$store.app.t.addPlaceholder"
          autocomplete="off"
          rows="3"
          :class="$store.app.newTitle.length > 100 ? 'border border-red-400 dark:border-red-500' : ''"
          class="modal-input flex-1 resize-none overflow-y-auto max-h-40"></textarea>
        <button
          @click="$store.app.addTask()"
          :disabled="!$store.app.newTitle.trim() || $store.app.newTitle.length > 100"
          class="lg:hidden shrink-0 w-11 h-11 flex items-center justify-center rounded-xl bg-sand-600 text-white disabled:opacity-30 active:scale-95 transition"
          :aria-label="$store.app.t.addTask">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
      </div>
      <p
        x-show="$store.app.newTitle.length > 100"
        class="text-xs text-red-400 dark:text-red-500 select-none"
        x-text="$store.app.t.charLimitError">
      </p>
    </div>
  </div>

  <!-- Detail Modal -->
  <div
    x-cloak
    x-show="$store.app.detail"
    x-transition:enter="transition ease-out duration-150"
    x-transition:enter-start="opacity-0"
    x-transition:enter-end="opacity-100"
    x-transition:leave="transition ease-in duration-100"
    x-transition:leave-start="opacity-100"
    x-transition:leave-end="opacity-0"
    @click.self="$store.app.closeDetail()"
    @keydown.escape.window="$store.app.closeDetail()"
    class="modal-overlay">
    <div
      @click.stop
      x-transition:enter="transition ease-out duration-150"
      x-transition:enter-start="opacity-0 translate-y-4"
      x-transition:enter-end="opacity-100 translate-y-0"
      class="modal-card space-y-4">
      <textarea
        id="detail-title-input"
        x-model="$store.app.detailDraft"
        @keydown.enter.prevent="$store.app.saveDetail()"
        @keydown.escape="$store.app.closeDetail()"
        autocomplete="off"
        rows="3"
        :class="$store.app.detailDraft.length > 100 ? 'border border-red-400 dark:border-red-500' : ''"
        class="modal-input w-full text-lg font-medium resize-none overflow-y-auto max-h-40"></textarea>
      <p
        x-show="$store.app.detailDraft.length > 100"
        class="text-xs text-red-400 dark:text-red-500 select-none -mt-2"
        x-text="$store.app.t.charLimitError">
      </p>
      <p
        x-show="$store.app.detailTask"
        class="text-xs text-sand-500 dark:text-sand-600 select-none"
        x-text="$store.app.t.taskAddedAt + ' ' + ($store.app.detailTask ? $store.app.toShamsiDate($store.app.detailTask.createdAt) : '')">
      </p>
      <div class="flex gap-2 pt-1">
        <button
          @click="$store.app.saveDetail()"
          :disabled="!$store.app.detailDraft.trim() || $store.app.detailDraft.length > 100"
          class="flex-1 py-2 rounded-xl bg-sand-700 dark:bg-sand-200 text-sand-50 dark:text-sand-900 text-sm font-medium disabled:opacity-30 active:scale-95 transition"
          x-text="$store.app.t.saveTask">
        </button>
        <button
          @click="$store.app.closeDetail()"
          class="py-2 px-4 rounded-xl border border-sand-300 dark:border-sand-700 text-sand-600 dark:text-sand-400 text-sm active:scale-95 transition"
          x-text="$store.app.t.cancelBtn">
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="./app.js"></script>

</body>
</html>
